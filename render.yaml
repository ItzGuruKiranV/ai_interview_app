services:
  - type: web
    name: interview-elevate-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: AUTH_REQUIRED
        value: "true"
      - key: ENABLE_CODE_EXECUTION
        value: "false"
      - key: CORS_ORIGINS
        value: https://interview-elevate-frontend.onrender.com
      - key: DB_PATH
        value: /tmp/interview-history.db
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: COHERE_API_KEY
        sync: false

  - type: web
    name: interview-elevate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://interview-elevate-api.onrender.com
      - key: REACT_APP_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html